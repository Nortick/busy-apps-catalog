category: clocks
short_description: A nixie-tube clock in orange or white, with three levels of flickper.
description: |-
  A nixie-tube clock for the BUSY Bar, ported from my native Nixie clock app.

  ## Controls

  On the clock, turn the wheel to change how much the tubes flickper: off, soft or strong. Press OK to switch between orange and white.

  ## Settings

  Setup has the rest: flickper, colour, 12 or 24 hours, seconds on or off and the colon (steady, blinking or pulsing).
