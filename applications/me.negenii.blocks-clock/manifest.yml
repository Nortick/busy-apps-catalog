description: |-
  A clock for the BUSY Bar inspired by a famous game, ported from my native clock app.

  ## Controls

  On the clock, turn the wheel to change the colour. Press OK to switch the animation on or off.

  ## Settings

  More controls available at Setup menu: colour, 12 or 24 hours, seconds on or off, how the seconds animate, speed, the colon and the animation switch.
